- name: Check herdr-mobile-relay is installed
  ansible.builtin.stat:
    path: "{{ herdr_mobile_relay_bin }}"
  register: herdr_mobile_relay_binary
  failed_when: not herdr_mobile_relay_binary.stat.exists

- name: Create herdr mobile relay config directory
  ansible.builtin.file:
    path: "{{ herdr_mobile_relay_env_file | dirname }}"
    state: directory
    mode: "0700"

# The token is the relay key the phone pairs with, generated once and never
# rotated here (the plugin's rotate-token does that)
- name: Generate herdr mobile relay token
  ansible.builtin.shell: |
    umask 077
    touch "$ENV_FILE" && chmod 600 "$ENV_FILE"
    grep -q '^HERDR_RELAY_TOKEN=.' "$ENV_FILE" 2>/dev/null && exit 0
    echo "HERDR_RELAY_TOKEN=$(openssl rand -hex 16)" >> "$ENV_FILE"
    echo generated
  environment:
    ENV_FILE: "{{ herdr_mobile_relay_env_file }}"
  register: herdr_mobile_relay_token
  changed_when: "'generated' in herdr_mobile_relay_token.stdout"
  notify: Restart herdr mobile relay

# A user service: the relay talks to the herdr server over the user's socket
- name: Create systemd user directory
  ansible.builtin.file:
    path: "{{ ansible_facts.env.HOME }}/.config/systemd/user"
    state: directory
    mode: "0755"

- name: Install herdr mobile relay user service
  ansible.builtin.template:
    src: herdr-mobile-relay.service.j2
    dest: "{{ ansible_facts.env.HOME }}/.config/systemd/user/herdr-mobile-relay.service"
    mode: "0644"
  register: herdr_mobile_relay_unit
  notify: Restart herdr mobile relay

- name: Enable and start herdr mobile relay user service
  ansible.builtin.systemd_service:
    name: herdr-mobile-relay.service
    scope: user
    daemon_reload: true
    enabled: true
    state: started
  # in check mode the unit does not exist until it is really installed
  when: not (ansible_check_mode and herdr_mobile_relay_unit is changed)
