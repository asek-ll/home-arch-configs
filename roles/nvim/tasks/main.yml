- name: Install neovim and git
  become: true
  community.general.pacman:
    name:
      - neovim
      - git
    state: present

- name: Clone nvim config
  ansible.builtin.git:
    repo: "{{ nvim_config_repo }}"
    dest: "{{ nvim_config_dest }}"
    version: "{{ nvim_config_version }}"
    update: "{{ nvim_config_update }}"
