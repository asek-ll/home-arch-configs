- name: Install syncthing
  become: true
  community.general.pacman:
    name: syncthing
    state: present
  register: syncthing_pkg

# syncthing.service ships with the package (/usr/lib/systemd/user/syncthing.service)
- name: Enable and start syncthing user service
  ansible.builtin.systemd_service:
    name: syncthing.service
    scope: user
    enabled: true
    state: started
  # in check mode the unit does not exist until the package is really installed
  when: not (ansible_check_mode and syncthing_pkg is changed)
