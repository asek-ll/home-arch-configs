---
# Proxies, rendered into the ProxyConfigs of /etc/proxybridge/ansible.pbprofile.
#   id                  referenced by rules (proxy_id); 0 in a rule means the first proxy
#   type                SOCKS5 or HTTP (UDP only works through SOCKS5)
#   username, password  optional
#   send_domain         ask the proxy for the host name instead of the IP (default true)
proxybridge_proxies:
  - id: 1
    name: main
    type: SOCKS5
    host: 100.64.0.2
    port: 1080
  # - id: 2
  #   name: web
  #   type: HTTP
  #   host: 100.64.0.9
  #   port: 8080
  #   username: u1
  #   password: p4

# Routing rules, evaluated in order, first match wins. With no rules nothing is
# proxied (ProxyBridge refuses to start with an empty rule list).
#   process   name/path globs separated by ';'   (default "*")
#   hosts     IPs, CIDRs, ranges, domains        (default "*")
#   ports     "443", "80;443", "8000-9000"       (default "*")
#   protocol  TCP, UDP or BOTH                   (default BOTH)
#   action    PROXY, DIRECT or BLOCK             (default PROXY)
#   proxy_id  proxy for a PROXY rule             (default 0, the first proxy)
proxybridge_rules:
  - name: wow
    process: "WoWExt.built.exe;wineserver"
    protocol: BOTH
    action: PROXY

# Let DNS (port 53) follow the rules; false sends DNS direct regardless of rules
proxybridge_dns_via_proxy: false

# 0 - no logs, 1 - log messages, 2 - connection events, 3 - both
proxybridge_verbose: 1

# Any other command line arguments, passed as is
proxybridge_extra_args: []

# Where the rendered profile goes (outside /etc/proxybridge/profiles, which the GUI owns)
proxybridge_profile_path: /etc/proxybridge/ansible.pbprofile
