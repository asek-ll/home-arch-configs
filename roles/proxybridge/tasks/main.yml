# proxybridge-git itself is built from AUR by the packages role (aur_packages)
- name: Check proxybridge is installed
  ansible.builtin.command: pacman -Q proxybridge-git
  register: proxybridge_pkg
  changed_when: false
  failed_when: false
  check_mode: false

# Since 4.0 proxies and rules come only from a .pbprofile. It may hold proxy
# passwords, so root only, like the GUI's own /etc/proxybridge/profiles.
- name: Create proxybridge config directory
  become: true
  ansible.builtin.file:
    path: /etc/proxybridge
    state: directory
    mode: "0700"

- name: Install proxybridge profile
  become: true
  ansible.builtin.template:
    src: proxybridge.pbprofile.j2
    dest: "{{ proxybridge_profile_path }}"
    mode: "0600"
  notify: Restart proxybridge

# The package ships no unit. ProxyBridge needs root for eBPF,
# so this is a system service, not a user one.
- name: Install proxybridge system service
  become: true
  ansible.builtin.template:
    src: proxybridge.service.j2
    dest: /etc/systemd/system/proxybridge.service
    mode: "0644"
  notify: Restart proxybridge

- name: Enable and start proxybridge system service
  become: true
  ansible.builtin.systemd_service:
    name: proxybridge.service
    daemon_reload: true
    enabled: true
    state: started
  # in check mode the binary does not exist until the package is really installed
  when: not (ansible_check_mode and proxybridge_pkg.rc != 0)
