- name: Install fish
  become: true
  community.general.pacman:
    name: fish
    state: present

# fish package registers itself in /etc/shells on install, but ensure it anyway
- name: Ensure fish is listed in /etc/shells
  become: true
  ansible.builtin.lineinfile:
    path: /etc/shells
    line: "{{ fish_path }}"
    state: present

- name: Set fish as default shell for current user
  become: true
  ansible.builtin.user:
    name: "{{ ansible_facts.user_id }}"
    shell: "{{ fish_path }}"
