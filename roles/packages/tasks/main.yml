- name: Install packages
  become: true
  community.general.pacman:
    name: "{{ packages }}"
    state: present

# AUR packages are built with makepkg as the login user and installed with
# pacman -U via become, so no passwordless sudo is needed for yay/makepkg.
- name: Install AUR build tools
  become: true
  community.general.pacman:
    name:
      - base-devel
      - git
    state: present

- name: Check installed AUR packages
  ansible.builtin.command: pacman -Q {{ item }}
  loop: "{{ aur_packages }}"
  register: aur_installed
  changed_when: false
  failed_when: false
  check_mode: false

# missing, or a -git package whose installed rNNN.<hash> is not the pinned commit
- name: Select AUR packages to build
  ansible.builtin.set_fact:
    aur_to_build: >-
      {%- set out = [] -%}
      {%- for r in aur_installed.results -%}
      {%-   set pin = aur_package_commits[r.item] | default('') -%}
      {%-   if r.rc != 0 or (pin and ('.' ~ pin[:7] ~ '-') not in r.stdout) -%}
      {%-     set _ = out.append(r.item) -%}
      {%-   endif -%}
      {%- endfor -%}
      {{ out }}

- name: Report AUR packages that would be installed
  ansible.builtin.debug:
    msg: "Would build and install {{ item.item }} from AUR"
  loop: "{{ aur_installed.results | selectattr('item', 'in', aur_to_build) }}"
  loop_control:
    label: "{{ item.item }}"
  changed_when: true
  when: ansible_check_mode

- name: Build and install missing AUR packages
  ansible.builtin.include_tasks: aur.yml
  loop: "{{ aur_to_build }}"
  loop_control:
    loop_var: aur_package
  when: not ansible_check_mode
